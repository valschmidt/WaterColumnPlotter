[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "WaterColumnPlotter"
version = "0.0.1"
description = "Package for real-time water column data visualization."
readme = "README.md"
authors = [{ name = "Lynette Davis", email = "ldavis@ccom.unh.edu" }, { name = "Val Schmidt", email = "Val.Schmidt@unh.edu" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["hydrography", "ocean mapping", "sonar", "hydrographic survey", "water column"]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=2.0",
    "pykmall>=1.1.2",
    "pys7k>=0.1.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
# The original Qt desktop GUI (water_column_plotter); the browser version (wcp) doesn't need it.
# Install with: pip install -e ".[gui]"
gui = [
    "PyQt5>=5.15",
    "pyqtgraph>=0.13",
]

[project.urls]
Homepage = "https://github.com/monsterkittykitty/WaterColumnPlotter"

[project.gui-scripts]
water_column_plotter = "WaterColumnPlotter.GUI.GUI_Main:main"

[project.scripts]
wcp = "WaterColumnPlotter.Web.app:main"

[tool.setuptools.packages.find]
include = ["WaterColumnPlotter*"]

[tool.setuptools.package-data]
"WaterColumnPlotter.GUI.Settings" = ["*.json"]
"WaterColumnPlotter.GUI.Dialogs.UIFiles" = ["*.ui"]
"WaterColumnPlotter.Web.static" = ["*.html", "*.js", "*.css", "*.png", "*.ico"]
